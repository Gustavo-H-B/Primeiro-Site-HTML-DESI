<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../site/style.css">
</head>
<body>
    <header>
        <nav>
           <a href="home.html">home🏠</a>
           <a href="produtos.html">produtos📦</a>
           <a href="contato.html">contato📞</a>
        </nav>
    </header>
    <hr>
    <main>
        <section class="tituloCont">
            <h1><strong><u>Entre em Contato Conosco! 🐸📞</u></strong></h1>
        </section>
        <section class="formulario">
            <form>
                <label for="nome">Nome: </label>
                <br>
                <input id="nome" type="text" placeholder="Escreva seu nome 🏷️" required>
                <br>
                <label for="email">E-mail: </label>
                <br>
                <input id="email" type="email" placeholder="Digite seu Email 📧" required>
                <br>
                <label for="dataNacimento">Data de Nascimento: </label>
                <br>
                <input id="dataNascimento" type="date" required>
                <br>
                <label for="senha">Senha</label>
                <br>
                <input id="senha" type="password" placeholder="Digite uma senha forte 🦾" required>
                <br>
                <label for="genero">Gênero: </label>
                <select id="genero">
                    <option value="masculino">Masculino ♂️</option>
                    <option value="feminino">Feminino♀️</option>
                    <option value="outro">Outro⚧️</option>
                </select>
                <br>
                <button class="limpar" type="reset">Limpar</button>
                <button class="enviar" type="submit">Enviar</button>
            </form>
        </section>
        <br>
        <img class="curriculo" height="500" width="1000" src="/site/assets/doly.jpg" alt="Aguardamos o contato">
    </main>
    <hr>
    <footer>
        <p class="copy">@2026: Copyright REX</p>
        <nav>
            <a href="home.html" >home🏠</a>
            <a href="../site/assets/regra.jpg" target="_blank">regras🛡️</a>
            <a href="../site/assets/cookie.jpg" target="_blank">cookies🍪</a>
            <a href="../site/assets/cleiton.jpg" target="_blank">ajuda📢</a>
        </nav>
    </footer>
</body>
</html>
